; Branding for the OS. Everything user-visible that says the product name comes from here.
; Renaming the OS later = change this file and rebuild.

[brand]
; Working name until we pick the real one.
name = Ashwood
; Lowercase, no spaces. Used in ISO file names.
slug = ashwood
version = 0.1
tagline = The classic desktop, reimagined.
; Shown on full-screen boot bitmaps so ReactOS is credited where people see it.
credit = Based on ReactOS

[logo]
; Colours are matched to the nearest entry in each bitmap's own palette.
text_colour = #FFFFFF
credit_colour = #C0C0C0
